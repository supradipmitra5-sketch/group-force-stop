      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK build
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK সংরক্ষণ (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GroupForceStop-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk

      - name: APK Release পেজে দেওয়া
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk GroupForceStop.apk
          gh release create "build-${{ github.run_number }}" GroupForceStop.apk --repo "${{ github.repository }}" --title "Build ${{ github.run_number }}" --notes "Debug APK"
